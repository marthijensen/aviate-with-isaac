<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Active Students</title>

    <link rel="stylesheet" href="active-student-card.css">
</head>

<body>

    <header class="top-nav">
        <div class="logo">
            AVIATE WITH ISAAC
        </div>
    </header>

    <main class="dashboard-container">

        <section class="student-summary">
            <p class="eyebrow">STUDENT OVERVIEW</p>

            <h1>
                Active Students:
                <span>0</span>
            </h1>
        </section>


        <section class="student-list">

            <div class="student-list-header">
                <span>Student</span>
                <span>Active For</span>
                <span></span>
            </div>


            <!-- PLACEHOLDER STUDENT -->

            <div class="student-row">

                <div class="student-name">
                    John Smith
                </div>

                <div class="student-time">
                    4 months
                </div>

                <div class="student-action">
                    <a href="#">
                        View Student →
                    </a>
                </div>

            </div>


            <!-- PLACEHOLDER STUDENT -->

            <div class="student-row">

                <div class="student-name">
                    Sarah Johnson
                </div>

                <div class="student-time">
                    7 months
                </div>

                <div class="student-action">
                    <a href="#">
                        View Student →
                    </a>
                </div>

            </div>


        </section>

    </main>

</body>
</html>
